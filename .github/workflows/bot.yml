name: MediaGrab bot

# GitHub Actions не даёт запускать job дольше 6 часов, поэтому бот
# перезапускается каждые 6 часов. Между окнами возможна пауза 10–30 минут:
# сообщения, отправленные в это время, Telegram придержит и бот обработает
# их при следующем старте (DROP_PENDING_UPDATES=false).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediagrab-polling
  # Новый запуск по расписанию заменяет предыдущий: окна не дрейфуют,
  # а зависший экземпляр не блокирует следующий.
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node.js 22 (для YouTube)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Зависимости
        run: pip install --upgrade -r requirements.txt

      - name: Проверка секрета BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Добавьте BOT_TOKEN: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Cookies из секретов (необязательно)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
          RUTUBE_COOKIES_B64: ${{ secrets.RUTUBE_COOKIES_B64 }}
        run: |
          mkdir -p cookies
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 -d > cookies/youtube.txt
          fi
          if [ -n "$INSTAGRAM_COOKIES_B64" ]; then
            printf '%s' "$INSTAGRAM_COOKIES_B64" | base64 -d > cookies/instagram.txt
          fi
          if [ -n "$TIKTOK_COOKIES_B64" ]; then
            printf '%s' "$TIKTOK_COOKIES_B64" | base64 -d > cookies/tiktok.txt
          fi
          if [ -n "$RUTUBE_COOKIES_B64" ]; then
            printf '%s' "$RUTUBE_COOKIES_B64" | base64 -d > cookies/rutube.txt
          fi
          chmod 600 cookies/*.txt 2>/dev/null || true

      - name: Бот (5 ч 45 мин, затем автоперезапуск по расписанию)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DROP_PENDING_UPDATES: "false"
          # По умолчанию 50 МБ; с отдельным локальным Bot API — до 2000 МБ.
          TELEGRAM_LOCAL_API_URL: ${{ secrets.TELEGRAM_LOCAL_API_URL }}
          MAX_UPLOAD_MB: ${{ vars.MAX_UPLOAD_MB }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_CONCURRENT_DOWNLOADS: "2"
          RATE_LIMIT_SECONDS: "10"
          YTDLP_JS_RUNTIME: node
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=120s 20700 python -m mediagrab
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ] || [ "$code" -eq 143 ] || [ "$code" -eq 137 ]; then
            echo "Окно работы закончилось — следующий запуск по расписанию."
            exit 0
          fi
          exit "$code"
